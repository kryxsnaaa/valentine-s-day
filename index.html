<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For My Favorite Person</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <style>
        body { background: #fff0f3; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; font-family: 'Arial', sans-serif; overflow: hidden; }
        
        /* The Clickable Gift */
        #gift { font-size: 100px; cursor: pointer; transition: 0.3s; animation: bounce 2s infinite; }
        @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-20px); } }

        /* The Hidden Content */
        #content { display: none; text-align: center; opacity: 0; transition: opacity 2s ease-in; }
        
        img { width: 280px; height: 280px; object-fit: cover; border-radius: 50%; border: 8px solid white; box-shadow: 0 10px 20px rgba(0,0,0,0.1); margin-bottom: 20px; }
        
        .letter { max-width: 400px; color: #590d22; line-height: 1.6; background: rgba(255,255,255,0.5); padding: 20px; border-radius: 15px; }
        
        h1 { color: #ff4d6d; margin-top: 0; }
    </style>
</head>
<body>

    <div id="gift" onclick="openValentine()">🎁</div>
    <p id="hint">Click to open your gift!</p>

    <div id="content">
        <img src="us.jpg" alt="Us">
        <div class="letter">
            <h1>Happy Valentine's Day!</h1>
            <p>I wanted to build you something as unique as you are. Thank you for being my person and for all the memories we've made.</p>
            <p>❤️ <b>I love you!</b></p>
        </div>
    </div>

    <script>
        function openValentine() {
            // Hide the gift
            document.getElementById('gift').style.display = 'none';
            document.getElementById('hint').style.display = 'none';
            
            // Show the photo and letter
            const content = document.getElementById('content');
            content.style.display = 'block';
            setTimeout(() => { content.style.opacity = '1'; }, 100);

            // Trigger Confetti!
            var duration = 3 * 1000;
            var end = Date.now() + duration;

            (function frame() {
              confetti({ particleCount: 3, angle: 60, spread: 55, origin: { x: 0 }, colors: ['#ff4d6d', '#ff758f'] });
              confetti({ particleCount: 3, angle: 120, spread: 55, origin: { x: 1 }, colors: ['#ff4d6d', '#ff758f'] });
              if (Date.now() < end) { requestAnimationFrame(frame); }
            }());
        }
    </script>
</body>
</html>
